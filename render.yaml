# Render.com blueprint: web service + persistent disk for the uploaded reports.
# On first deploy Render asks for PANEL_PASSWORD (the shared sign-in password).
services:
  - type: web
    name: research-portal
    runtime: docker
    plan: starter
    autoDeploy: true
    healthCheckPath: /api/health
    disk:
      name: reports
      mountPath: /app/data/reports
      sizeGB: 5
    envVars:
      - key: PORT
        value: "8765"
      - key: PANEL_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
