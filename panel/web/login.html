<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in | AID Research Panel</title>
<style>
:root{--navy-950:#051528; --navy-800:#0C2B4E; --blue-600:#1668C7; --blue-700:#0F5BB5; --bg:#F2F5F9; --card:#fff; --ink:#16222F; --muted:#5E6F82; --line:#D9E1EB; --danger:#B42318}
*{box-sizing:border-box}
body{margin:0; min-height:100vh; background:linear-gradient(100deg,#27337F 0%,#3D4FB8 55%,#5E71DC 100%); font:15px/1.6 "Segoe UI",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; color:var(--ink); display:flex; flex-direction:column}
.top{background:var(--navy-950); color:#fff; height:52px; display:flex; align-items:baseline; gap:9px; padding:0 20px; line-height:52px}
.top b{font-size:16.5px; letter-spacing:.4px}
.top span{font-size:11px; color:#8FB4DE; letter-spacing:1.6px; font-weight:600}
.wrap{flex:1; display:flex; align-items:center; justify-content:center; padding:24px}
.card{background:var(--card); border-radius:6px; box-shadow:0 10px 30px rgba(5,16,32,.35); padding:30px 32px 26px; width:100%; max-width:400px}
h1{font-size:20px; margin:0 0 4px}
p.sub{margin:0 0 20px; color:var(--muted); font-size:13px}
label{display:block; font-size:11.5px; font-weight:700; color:var(--muted); letter-spacing:.4px; text-transform:uppercase; margin-bottom:5px}
input{width:100%; font:inherit; font-size:15px; padding:10px 12px; border:1px solid var(--line); border-radius:4px; color:var(--ink)}
input:focus{outline:none; border-color:var(--blue-600)}
button{margin-top:16px; width:100%; font:inherit; font-size:14px; font-weight:700; color:#fff; background:var(--blue-600); border:0; border-radius:4px; padding:11px; cursor:pointer}
button:hover{background:var(--blue-700)}
button:disabled{opacity:.6; cursor:default}
.err{color:var(--danger); font-size:13px; margin-top:12px; min-height:18px}
.foot{font-size:11.5px; color:var(--muted); margin-top:18px; text-align:center}
</style>
</head>
<body>
<div class="top"><b>JUNSON CAPITAL</b><span>AID RESEARCH</span></div>
<div class="wrap">
  <form class="card" id="f">
    <h1>Sign in · 登录</h1>
    <p class="sub">AID Market Research Panel · 仅供内部研究使用</p>
    <label for="pw">Password · 密码</label>
    <input id="pw" type="password" autocomplete="current-password" autofocus required>
    <button type="submit" id="btn">Sign in · 登录</button>
    <div class="err" id="err"></div>
    <div class="foot">© Junson Capital · AID Research</div>
  </form>
</div>
<script>
(function(){
  var f = document.getElementById('f'), pw = document.getElementById('pw'), err = document.getElementById('err'), btn = document.getElementById('btn');
  var next = new URLSearchParams(location.search).get('next') || '';
  f.addEventListener('submit', function(e){
    e.preventDefault(); err.textContent = ''; btn.disabled = true;
    fetch('/api/login', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({password: pw.value})})
      .then(function(r){ return r.json().then(function(d){ return {ok: r.ok, d: d}; }); })
      .then(function(x){
        if (x.ok) location.href = '/' + (next && next.charAt(0) === '#' ? next : '');
        else { err.textContent = 'Wrong password · 密码错误'; btn.disabled = false; pw.select(); }
      })
      .catch(function(){ err.textContent = 'Could not reach the server · 无法连接服务器'; btn.disabled = false; });
  });
})();
</script>
</body>
</html>
