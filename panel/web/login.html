<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in | AID Research Panel</title>
<style>
:root{--navy-950:#051528; --navy-800:#0C2B4E; --blue-600:#1668C7; --blue-700:#0F5BB5; --bg:#F2F5F9; --card:#fff; --ink:#16222F; --muted:#5E6F82; --line:#D9E1EB; --danger:#B42318}
*{box-sizing:border-box}
body{margin:0; min-height:100vh; background:linear-gradient(100deg,#27337F 0%,#3D4FB8 55%,#5E71DC 100%); font:15px/1.6 "Segoe UI",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; color:var(--ink); display:flex; flex-direction:column}
.top{background:var(--navy-950); color:#fff; height:52px; display:flex; align-items:baseline; gap:9px; padding:0 20px; line-height:52px}
.top b{font-size:16.5px; letter-spacing:.4px}
.top span{font-size:11px; color:#8FB4DE; letter-spacing:1.6px; font-weight:600}
.wrap{flex:1; display:flex; align-items:center; justify-content:center; padding:24px}
.card{background:var(--card); border-radius:6px; box-shadow:0 10px 30px rgba(5,16,32,.35); padding:30px 32px 26px; width:100%; max-width:400px}
h1{font-size:20px; margin:0 0 4px}
p.sub{margin:0 0 20px; color:var(--muted); font-size:13px}
label{display:block; font-size:11.5px; font-weight:700; color:var(--muted); letter-spacing:.4px; text-transform:uppercase; margin-bottom:5px}
input{width:100%; font:inherit; font-size:15px; padding:10px 12px; border:1px solid var(--line); border-radius:4px; color:var(--ink)}
input:focus{outline:none; border-color:var(--blue-600)}
.card button{margin-top:16px; width:100%; font:inherit; font-size:14px; font-weight:700; color:#fff; background:var(--blue-600); border:0; border-radius:4px; padding:11px; cursor:pointer}
.card button:hover{background:var(--blue-700)}
.card button:disabled{opacity:.6; cursor:default}
.card button.auto-sign{margin-top:10px; color:#143a6e; background:#fff; border:1px solid #143a6e}
.card button.auto-sign:hover{background:#f4f7fb}
.card .err{color:var(--danger); font-size:13px; margin-top:12px; min-height:18px; overflow-wrap:anywhere}
.card .foot{font-size:11.5px; color:var(--muted); margin-top:18px; text-align:center}
</style>
</head>
<body>
<div class="top"><b>JUNSON CAPITAL</b><span>AID RESEARCH</span></div>
<div class="wrap">
  <form class="card" id="passwordForm">
    <h1>Sign in · 登录</h1>
    <p class="sub">AID Market Research Panel · 仅供内部研究使用</p>
    <label for="passwordInput">Password · 密码</label>
    <input id="passwordInput" type="password" autocomplete="current-password" autofocus required>
    <button type="submit" id="signInButton">Sign in · 登录</button>
    <button type="button" class="auto-sign" id="autoSignButton">Auto Sign</button>
    <div class="err" id="loginError"></div>
    <div class="foot">© Junson Capital · AID Research</div>
  </form>
  <form id="azureForm" method="post" action="/api/auth/login" hidden>
    <input type="hidden" name="loginWay" value="AZURE_AD">
    <input type="hidden" name="loginAfterCallbackUrl" id="loginAfterCallbackUrl">
    <input type="hidden" name="logout" id="azureLogout">
  </form>
</div>
<script src="/config.js"></script>
<script>
(function(){
  var passwordForm = document.getElementById('passwordForm');
  var passwordInput = document.getElementById('passwordInput');
  var loginError = document.getElementById('loginError');
  var signInButton = document.getElementById('signInButton');
  var autoSignButton = document.getElementById('autoSignButton');
  var query = new URLSearchParams(location.search);
  var next = query.get('next') || location.hash || '';
  var logout = query.get('logout') || '';
  var config = window.AID_CONFIG || {};
  var autoAzureLogin = config.autoAzureLogin === true;
  var loginFailed = query.get('result') === 'fail';
  if (loginFailed) loginError.textContent = query.get('msg') || 'Azure sign-in failed';
  function startAzureLogin(){
    autoSignButton.disabled = true;
    signInButton.disabled = true;
    if (!loginFailed) loginError.textContent = '';
    var returnUrl = new URL('/', location.origin);
    if (next.charAt(0) === '#') returnUrl.hash = next.slice(1);
    else if (next.charAt(0) === '/' && next.charAt(1) !== '/') returnUrl.pathname = next;
    document.getElementById('loginAfterCallbackUrl').value = returnUrl.toString();
    document.getElementById('azureLogout').value = logout === '1' ? '1' : '';
    document.getElementById('azureForm').submit();
  }
  passwordForm.addEventListener('submit', function(event){
    event.preventDefault(); loginError.textContent = ''; signInButton.disabled = true;
    fetch('/api/login', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({password: passwordInput.value})})
      .then(function(response){ return response.json().then(function(payload){ return {ok: response.ok, payload: payload}; }); })
      .then(function(result){
        if (result.ok) location.href = `/${next && next.charAt(0) === '#' ? next : ''}`;
        else { loginError.textContent = 'Wrong password · 密码错误'; signInButton.disabled = false; passwordInput.select(); }
      })
      .catch(function(){ loginError.textContent = 'Could not reach the server · 无法连接服务器'; signInButton.disabled = false; });
  });
  autoSignButton.addEventListener('click', startAzureLogin);
  if (autoAzureLogin && !loginFailed) startAzureLogin();
})();
</script>
</body>
</html>
