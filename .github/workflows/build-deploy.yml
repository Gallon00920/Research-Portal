name: Build reports and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work on the latest main (re-runs of older commits included)
        run: git switch -C main origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install fonts (CJK) and Python packages
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk fonts-dejavu-core
          pip install -r panel/requirements.txt cryptography -r factors/requirements.txt

      - name: Parse uploads and apply edits
        env:
          PANEL_PASSWORD: ${{ secrets.PANEL_PASSWORD }}
        run: python panel/backend/build_static.py --apply --strip-plain

      # Investment performance: Claude reads each image the site committed to factors/incoming/ and
      # writes that month's data. Without the secret the uploads simply wait for a later run.
      - name: Read investment performance images
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python factors/scripts/extract_factors.py --apply

      # Macro / Market: Claude reads each slide image the site committed to macro/incoming/ and
      # writes that month's brief (same secret, same waiting rule as above).
      - name: Read macro / market slides
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python macro/scripts/extract_macro.py --apply

      - name: Commit parsed reports back to the repository
        run: |
          git config user.name "aid-panel-bot"
          git config user.email "aid-panel-bot@users.noreply.github.com"
          git add -A panel/data panel/incoming panel/ops factors/data factors/incoming factors/failed macro/data macro/incoming macro/failed
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "build: parsed uploads / applied edits [skip ci]"
            for i in 1 2 3; do
              git push origin HEAD:main && break
              echo "push rejected, retrying after rebase ($i)"
              git fetch origin main
              git rebase -X theirs origin/main || { git rebase --abort; exit 1; }
            done
          fi

      - name: Build static site
        env:
          PANEL_PASSWORD: ${{ secrets.PANEL_PASSWORD }}
        run: python panel/backend/build_static.py --site site

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
